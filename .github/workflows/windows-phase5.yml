name: Windows Phase 5

on:
  push:
    branches: [main, phase-5]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify Phase 5
        shell: pwsh
        run: .\verify-and-run-phase5.ps1 -Configuration Release -NoLaunch
