name: Windows Phase 3

on:
  push:
    branches: [main, phase-3]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\ChessMentor.sln
      - name: Build
        run: dotnet build .\ChessMentor.sln -c Release --no-restore
      - name: Test
        run: dotnet test .\tests\ChessMentor.Tests\ChessMentor.Tests.csproj -c Release --no-build --no-restore
